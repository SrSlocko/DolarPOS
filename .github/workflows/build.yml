name: Build DolarPOS

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DolarPOS.sln

      - name: Build
        run: dotnet build DolarPOS.sln -c Release --no-restore

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DolarPOS-Build
          path: '**/bin/Release/**'
          retention-days: 30

  publish:
    # Solo publica el ejecutable autocontenido en tags (vX.Y.Z)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish single-file (win-x64)
        run: >
          dotnet publish src/DolarPOS.Presentacion/DolarPOS.Presentacion.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:DebugType=None
          -o publish

      - name: Create zip
        run: cd publish && zip -r ../DolarPOS-win-x64.zip . && cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: DolarPOS-win-x64.zip
          generate_release_notes: true
